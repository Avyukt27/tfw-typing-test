<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Typing Test</title>
  </head>
  <body>
    <div>
      <div class="heading">Simple Typing Test</div>
      <div class="header">
        <div class="wpm">
          <div class="text">WPM</div>
          <div class="curr_wpm">100</div>
        </div>
        <div class="errors">
          <div class="text">Errors</div>
          <div class="curr_err">0</div>
        </div>
        <div class="time">
          <div class="text">Time</div>
          <div class="curr_time">60s</div>
        </div>
        <div class="accuracy">
          <div class="text">% Accuracy</div>
          <div class="curr_accuracy">100</div>
        </div>
      </div>

      <div class="input_area" tabindex="0">
        <span class="typer">|</span>
      </div>
      <button class="restart">Restart</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
